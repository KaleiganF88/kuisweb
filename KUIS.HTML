<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kuis Sederhana</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f8ff;
      padding: 50px;
    }
    .question-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: inline-block;
    }
    .option {
      display: block;
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
    }
    .option:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>

  <div class="question-box" id="quiz-container">
    <h2 id="question">Loading...</h2>
    <div id="options"></div>
  </div>

  <script>
    const quiz = [
      {
        question: "Apa ibu kota Indonesia?",
        options: ["Bandung", "Surabaya", "Jakarta", "Bali"],
        answer: "Jakarta"
      },
      {
        question: "2 + 2 = ?",
        options: ["3", "4", "5", "22"],
        answer: "4"
      }
    ];

    let current = 0;
    let score = 0;

    function showQuestion() {
      const q = quiz[current];
      document.getElementById('question').innerText = q.question;
      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';

      q.options.forEach(option => {
        const btn = document.createElement('div');
        btn.classList.add('option');
        btn.innerText = option;
        btn.onclick = () => checkAnswer(option);
        optionsDiv.appendChild(btn);
      });
    }

    function checkAnswer(selected) {
      if (selected === quiz[current].answer) score++;
      current++;
      if (current < quiz.length) {
        showQuestion();
      } else {
        document.getElementById('quiz-container').innerHTML = `
          <h2>Skor Kamu: ${score}/${quiz.length}</h2>
          <p>Terima kasih sudah mengikuti kuis!</p>
        `;
      }
    }

    showQuestion();
  </script>

</body>
</html>
